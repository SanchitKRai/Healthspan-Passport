services:
  - type: web
    name: healthspan-passport-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: OPENROUTER_API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: "https://frontend-tau-murex-6pqd8vtg90.vercel.app,http://localhost:3000"
      # Optional: restrict preview origins to your Vercel project only
      # - key: ALLOW_ORIGIN_REGEX
      #   value: "^https://frontend-[a-z0-9-]+\\.vercel\\.app$"
